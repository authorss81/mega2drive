name: secret-guard
# ---------------------------------------------------------------------------
# Fails the build if a credential has been committed to this PUBLIC repo.
#
# This is the backstop for the local pre-commit hook: hooks are per-clone and
# trivially bypassed (`--no-verify`, or a push from another machine), so the
# authoritative check has to run in CI where nobody can skip it.
#
# A GitHub Secret is safe by construction. A committed secret is not: it is
# served from a CDN cache within minutes and stays in history permanently, so
# this check exists to make that failure loud and immediate rather than
# discovered months later.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so a secret introduced and reverted in an earlier
          # commit is still caught rather than only the current tree.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files for credentials
        run: python guard_secrets.py

      - name: Confirm the filled-in configs were never committed
        run: |
          set -euo pipefail
          bad=0
          for f in config.yaml config_drive_source.yaml; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::tracked - this holds real credentials"
              bad=1
            fi
          done
          if git ls-files | grep -qE '(^|/)credentials/'; then
            echo "::error::credentials/ is tracked - OAuth tokens are committed"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo ""
            echo "If a real credential was committed, deleting the file is NOT enough."
            echo "Rotate the credential, then purge it from history."
            exit 1
          fi
          echo "No credential files tracked."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Secret guard"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "No credentials found in tracked files."
            else
              echo "**Credentials detected.** Treat every value listed above as"
              echo "compromised: rotate the MEGA passwords, revoke and reissue the"
              echo "Google OAuth client, and delete the GitHub token."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
