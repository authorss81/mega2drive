name: mega2yt

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list-only (inventory only, no transfers) or run-all"
        required: false
        default: "run-all"
  # SCHEDULE TEMPORARILY DISABLED 2026-10-05 - the manifest is incomplete and
  # each run re-uploads unrecorded files, creating YouTube duplicates. Do NOT
  # re-enable until the full inventory + reconciliation is committed.
  # schedule:
  #   Every 6 hours (see the note that was here about continuous draining).
  #   - cron: "0 */6 * * *"

permissions:
  contents: write                # needed so the job can commit manifest.csv/inventory.csv back to the repo

# One run at a time. The dispatcher can queue a follow-up run the moment this
# one finishes; without this, a queued run and a still-finishing run would both
# be writing the same manifest and racing each other.
concurrency:
  group: mega2yt
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # stay safely under GitHub's 6-hour (360 min) hard job limit

    env:
      # Belt and braces with the flush=True in log(). Without this, Python
      # block-buffers stdout because a runner's stdout is a pipe, and a run
      # that is genuinely working shows NO output for tens of minutes - it looks
      # hung. This covers output from subprocesses too, which flush=True in the
      # script cannot reach.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install mega-cmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y ./megacmd-xUbuntu_22.04_amd64.deb

      - name: Reconstruct config.yaml and credentials from Secrets
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          CLIENT_SECRET_CHANNEL1: ${{ secrets.CLIENT_SECRET_CHANNEL1 }}
          CLIENT_SECRET_CHANNEL2: ${{ secrets.CLIENT_SECRET_CHANNEL2 }}
          CLIENT_SECRET_CHANNEL3: ${{ secrets.CLIENT_SECRET_CHANNEL3 }}
          CLIENT_SECRET_CHANNEL4: ${{ secrets.CLIENT_SECRET_CHANNEL4 }}
          CLIENT_SECRET_CHANNEL5: ${{ secrets.CLIENT_SECRET_CHANNEL5 }}
          TOKEN_CHANNEL1: ${{ secrets.TOKEN_CHANNEL1 }}
          TOKEN_CHANNEL2: ${{ secrets.TOKEN_CHANNEL2 }}
          TOKEN_CHANNEL3: ${{ secrets.TOKEN_CHANNEL3 }}
          TOKEN_CHANNEL4: ${{ secrets.TOKEN_CHANNEL4 }}
          TOKEN_CHANNEL5: ${{ secrets.TOKEN_CHANNEL5 }}
          CLIENT_SECRET_DRIVE: ${{ secrets.CLIENT_SECRET_DRIVE }}
          TOKEN_DRIVE: ${{ secrets.TOKEN_DRIVE }}
        run: |
          mkdir -p credentials
          echo "$CONFIG_YAML" > config.yaml
          echo "$CLIENT_SECRET_CHANNEL1" > credentials/client_secret_channel1.json
          echo "$CLIENT_SECRET_CHANNEL2" > credentials/client_secret_channel2.json
          echo "$CLIENT_SECRET_CHANNEL3" > credentials/client_secret_channel3.json
          echo "$CLIENT_SECRET_CHANNEL4" > credentials/client_secret_channel4.json
          echo "$CLIENT_SECRET_CHANNEL5" > credentials/client_secret_channel5.json
          echo "$TOKEN_CHANNEL1" > credentials/token_channel1.json
          echo "$TOKEN_CHANNEL2" > credentials/token_channel2.json
          echo "$TOKEN_CHANNEL3" > credentials/token_channel3.json
          echo "$TOKEN_CHANNEL4" > credentials/token_channel4.json
          echo "$TOKEN_CHANNEL5" > credentials/token_channel5.json
          # Only relevant if google_drive.enabled is true in config.yaml —
          # writes empty files otherwise (harmless, script won't use them).
          echo "$CLIENT_SECRET_DRIVE" > credentials/client_secret_drive.json
          echo "$TOKEN_DRIVE" > credentials/token_drive.json
          # (If you have fewer than 5 channels, leave the unused secrets empty in
          # GitHub — this just writes empty files for them, which the script
          # simply won't find valid clients for and will skip.)

      - name: Snapshot manifest (before the run)
        run: python run_report.py snapshot --manifest manifest.csv

      - name: Run the pipeline
        run: |
          if [ "${{ github.event.inputs.mode || 'run-all' }}" = "list-only" ]; then
            python mega_to_youtube.py --list-only
          else
            python mega_to_youtube.py --run-all
          fi

      - name: Record what this run accomplished
        if: always()
        run: |
          python run_report.py report --manifest manifest.csv \
            --pipeline mega2yt \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Verify nothing was lost (informational — won't fail the run)
        continue-on-error: true
        run: python verify_mega_pipeline.py

      # Keep the manifest even when the commit below cannot succeed. The files
      # are already safely on YouTube/Drive by this point, but the manifest is
      # what stops the NEXT run re-uploading them, so losing it means duplicate
      # uploads. An artifact survives a failed push and can be restored by hand.
      - name: Preserve manifest and logs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega2yt-manifest-${{ github.run_id }}
          path: |
            manifest.csv
            inventory.csv
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit updated manifest/inventory/logs back to the repo
        # A push conflict must never fail the job. Uploads are already done and
        # an artifact holds the manifest; losing the run's green tick over a
        # bookkeeping push would be a bad trade.
        continue-on-error: true
        run: |
          git config user.name "mega2yt-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add each path separately. `git add a b c` is ATOMIC: if any one of
          # the pathspecs matches nothing (inventory.csv only exists after
          # --list-only) the whole command fails and NOTHING is added - not even
          # the manifest, not even the run report. That failure was invisible
          # because of the 2>/dev/null, so the job reported success while
          # committing nothing.
          for f in manifest.csv inventory.csv logs/; do
            if [ -e "$f" ]; then
              git add -A "$f"
            else
              echo "skip (not present): $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "Update manifest/logs [automated]"

          # Retry with a rebase. A plain `git push` is rejected whenever anyone
          # pushes to main while this run is in flight - which happens whenever
          # a fix is committed during a multi-hour run. Rebasing onto the new
          # remote head and pushing again resolves it in the common case.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::warning::could not push the manifest after 3 attempts."
          echo "The manifest is preserved in this run's artifact; restore it if needed."
