name: drive2mega-yt

# ---------------------------------------------------------------------------
# SCHEDULE IS DISABLED - this pipeline is not configured yet.
#
# It needs its own config (config_drive_source.yaml), its own Drive landing
# folder, and its own MEGA storage accounts, none of which exist. While the
# schedule was active it failed every 6 hours on a missing config, which put a
# permanent red X in the Actions list and made it impossible to tell at a glance
# whether the *other* pipeline - the one that matters - was healthy.
#
# workflow_dispatch is kept, so it can still be run by hand once configured.
# To re-enable the schedule, uncomment the two schedule lines below.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: {}
  # schedule:
  #   # Every 6 hours, offset by 30 minutes from mega2yt so the two pipelines
  #   # don't target the same start time. See the note in
  #   # mega-to-youtube-workflow.yml about why this is more often than daily.
  #   - cron: "30 */6 * * *"

permissions:
  contents: write

# One run at a time. The dispatcher can queue a follow-up run the moment this
# one finishes; without this, a queued run and a still-finishing run would both
# be writing the same manifest and racing each other.
concurrency:
  group: drive2mega-yt
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      # A runner's stdout is a pipe, so Python block-buffers it and a working
      # run shows no output for tens of minutes. See the same note in
      # mega-to-youtube-workflow.yml.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install mega-cmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y ./megacmd-xUbuntu_22.04_amd64.deb

      - name: Reconstruct config and credentials from Secrets
        env:
          CONFIG_DRIVE_SOURCE_YAML: ${{ secrets.CONFIG_DRIVE_SOURCE_YAML }}
          CLIENT_SECRET_DRIVE_SOURCE: ${{ secrets.CLIENT_SECRET_DRIVE_SOURCE }}
          TOKEN_DRIVE_SOURCE: ${{ secrets.TOKEN_DRIVE_SOURCE }}
          CLIENT_SECRET_CHANNEL1: ${{ secrets.CLIENT_SECRET_CHANNEL1 }}
          CLIENT_SECRET_CHANNEL2: ${{ secrets.CLIENT_SECRET_CHANNEL2 }}
          CLIENT_SECRET_CHANNEL3: ${{ secrets.CLIENT_SECRET_CHANNEL3 }}
          CLIENT_SECRET_CHANNEL4: ${{ secrets.CLIENT_SECRET_CHANNEL4 }}
          CLIENT_SECRET_CHANNEL5: ${{ secrets.CLIENT_SECRET_CHANNEL5 }}
          TOKEN_CHANNEL1: ${{ secrets.TOKEN_CHANNEL1 }}
          TOKEN_CHANNEL2: ${{ secrets.TOKEN_CHANNEL2 }}
          TOKEN_CHANNEL3: ${{ secrets.TOKEN_CHANNEL3 }}
          TOKEN_CHANNEL4: ${{ secrets.TOKEN_CHANNEL4 }}
          TOKEN_CHANNEL5: ${{ secrets.TOKEN_CHANNEL5 }}
        run: |
          mkdir -p credentials
          echo "$CONFIG_DRIVE_SOURCE_YAML" > config_drive_source.yaml
          echo "$CLIENT_SECRET_DRIVE_SOURCE" > credentials/client_secret_drive_source.json
          echo "$TOKEN_DRIVE_SOURCE" > credentials/token_drive_source.json
          echo "$CLIENT_SECRET_CHANNEL1" > credentials/client_secret_channel1.json
          echo "$CLIENT_SECRET_CHANNEL2" > credentials/client_secret_channel2.json
          echo "$CLIENT_SECRET_CHANNEL3" > credentials/client_secret_channel3.json
          echo "$CLIENT_SECRET_CHANNEL4" > credentials/client_secret_channel4.json
          echo "$CLIENT_SECRET_CHANNEL5" > credentials/client_secret_channel5.json
          echo "$TOKEN_CHANNEL1" > credentials/token_channel1.json
          echo "$TOKEN_CHANNEL2" > credentials/token_channel2.json
          echo "$TOKEN_CHANNEL3" > credentials/token_channel3.json
          echo "$TOKEN_CHANNEL4" > credentials/token_channel4.json
          echo "$TOKEN_CHANNEL5" > credentials/token_channel5.json
          # 30 Mega account credentials live INSIDE config_drive_source.yaml
          # itself (the CONFIG_DRIVE_SOURCE_YAML secret) rather than as 30
          # separate secrets — simpler to manage at that scale.

      - name: Snapshot manifest (before the run)
        run: python run_report.py snapshot --manifest manifest_drive_source.csv

      - name: Run the pipeline
        run: python drive_to_mega_youtube.py --run-all

      - name: Record what this run accomplished
        if: always()
        run: |
          python run_report.py report --manifest manifest_drive_source.csv \
            --pipeline drive2mega-yt \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Verify nothing was lost (informational — won't fail the run)
        continue-on-error: true
        run: python verify_drive_pipeline.py

      - name: Preserve manifest and logs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive2mega-yt-manifest-${{ github.run_id }}
          path: |
            manifest_drive_source.csv
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit updated manifest/logs back to the repo
        # Never fail the job over a bookkeeping push - see the note in
        # mega-to-youtube-workflow.yml. The artifact above holds the manifest.
        continue-on-error: true
        run: |
          git config user.name "drive2mega-yt-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add each path separately: `git add a b` is ATOMIC, so one missing
          # pathspec silently aborted the whole add and committed nothing.
          for f in manifest_drive_source.csv logs/; do
            if [ -e "$f" ]; then
              git add -A "$f"
            else
              echo "skip (not present): $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "Update manifest/logs [automated]"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::warning::could not push the manifest after 3 attempts."
          echo "The manifest is preserved in this run's artifact; restore it if needed."
